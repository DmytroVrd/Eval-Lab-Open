services:
  api:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOCAL_MOCK_WITHOUT_KEYS: ${LOCAL_MOCK_WITHOUT_KEYS:-true}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/eval_lab.db}
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - eval_lab_data:/app/data

  db:
    image: postgres:16-alpine
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eval_lab}
      POSTGRES_USER: ${POSTGRES_USER:-eval_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eval_lab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eval_lab_postgres:/var/lib/postgresql/data

volumes:
  eval_lab_data:
  eval_lab_postgres:
